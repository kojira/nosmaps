<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="nosmaps">
  <title>nosmaps</title>
  <link rel="icon" href="favicon.svg?v=20260816100916">
  <link rel="stylesheet" href="styles.css?v=20260816100916">
  <link rel="stylesheet" href="nip-explorer.css?v=20260816100916">
</head>
<body class="nip-explorer-page">
  <a class="skip" href="#main" id="skip-link"></a>
  <div id="offline-banner" class="offline-banner" hidden role="status"></div>
  <main id="main" tabindex="-1">
    <div class="compact-identity" id="compact-identity"></div>
    <section id="feature-search" class="feature-search">
      <label class="feature-main-search" for="feature-query"><span id="search-title"></span><input id="feature-query" type="search" autocomplete="off"></label>
      <div id="feature-chips" class="feature-chips" role="group"></div>
    </section>
    <section id="results" class="results-section">
      <div class="results-bar"><div><h1 id="results-title"></h1><div id="selected-feature-summary" class="selected-summary" aria-live="polite"></div></div><strong id="result-count"></strong></div>
      <div class="mobile-condition-summary" id="condition-summary" aria-live="polite"></div>
      <details class="feature-filter-details" id="filter-details">
        <summary><span id="settings-label"></span> <b id="active-filter-count">0</b></summary>
        <div class="feature-filter-grid" id="feature-filter-grid"></div>
      </details>
      <div id="ui-state-view" aria-live="polite"></div>
      <div id="compare-actions" class="compare-actions" hidden><span id="compare-summary"></span><div><button id="open-compare" class="primary" type="button" disabled></button><button id="clear-compare" class="ghost" type="button"></button></div></div>
      <div id="tool-results" class="feature-tool-results"></div>
    </section>
    <section id="nip-reference" class="nip-reference"><div class="section-head"><div><span class="step">NIP</span><h2 id="nip-reference-title"></h2></div><span id="nip-count" class="count-pill"></span></div><div id="nip-list" class="nip-list" aria-live="polite"></div></section>
  </main>
  <dialog id="evidence-dialog"><div id="evidence-content"></div></dialog>
  <dialog id="compare-dialog" class="comparison-dialog"><div id="compare-content"></div></dialog>
  <dialog id="review-dialog" class="review-dialog"><div id="review-content"></div></dialog>
  <dialog id="profile-dialog" class="review-dialog profile-dialog"><div id="profile-content"></div></dialog>
  <dialog id="gallery-dialog" class="review-dialog gallery-dialog"><div id="gallery-content"></div></dialog>
  <dialog id="image-dialog" class="image-dialog"><div id="image-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="data.js?v=20260816100916"></script>
  <script src="i18n.js?v=20260816100916"></script>
  <script src="icons.js?v=20260816100916"></script>
  <script src="nip-explorer.js?v=20260816100916"></script>
</body>
</html>
