<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="使いたい機能からNostrツール候補を逆引きし、NIPの裏付けと機能差を比較する静的UI">
  <title>Nosmaps — 機能から探す</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="nip-explorer.css">
</head>
<body class="nip-explorer-page">
  <a class="skip" href="#main">本文へスキップ</a>
  <div id="offline-banner" class="offline-banner" hidden role="status">オフライン：保存済みデータを表示しています。外部通信はありません。</div>

  <main id="main" tabindex="-1">
    <div class="compact-identity" aria-label="現在位置">
      <a href="index.html" aria-label="Nosmaps 4案トップへ戻る"><span class="identity-mark" aria-hidden="true">N</span><span>Nosmaps</span></a>
      <span aria-hidden="true">/</span>
      <span>機能から探す</span>
    </div>

    <section id="feature-search" class="feature-search" aria-labelledby="search-title">
      <label class="feature-main-search" for="feature-query">
        <span id="search-title">アプリ／サービスを全文検索</span>
        <input id="feature-query" type="search" placeholder="名称・概要・カテゴリ・OS・提供形態・別名" autocomplete="off" aria-describedby="search-help">
        <small id="search-help">機能は下の10個から選択。全文検索と機能選択はANDで絞り込みます。</small>
      </label>
      <div id="feature-chips" class="feature-chips" role="listbox" aria-label="主要機能"></div>
    </section>

    <section id="results" class="results-section" aria-labelledby="results-title">
      <div class="results-bar">
        <div>
          <h1 id="results-title">候補</h1>
          <p id="selected-feature-summary" class="selected-summary" aria-live="polite"></p>
        </div>
        <strong id="result-count"></strong>
      </div>

      <div class="mobile-condition-summary" id="condition-summary" aria-live="polite"></div>
      <details class="feature-filter-details" id="filter-details">
        <summary>絞り込み <span id="active-filter-count">0</span></summary>
        <div class="feature-filter-grid">
          <label class="field">OS<select id="platform-filter"><option value="all">すべて</option><option>Web</option><option>Desktop</option><option>Mobile</option></select></label>
          <label class="field">カテゴリ<select id="category-filter"><option value="all">すべて</option></select></label>
          <label class="field">更新状態<select id="tool-status-filter"><option value="all">稼働・停滞・不明</option><option value="active">active</option><option value="stale">stale</option><option value="unknown">unknown</option></select></label>
          <label class="field">機能対応<select id="support-filter"><option value="all">すべて</option><option value="implemented">対応</option><option value="partial">部分対応</option><option value="planned">予定</option><option value="unknown">不明</option></select></label>
          <label class="field">提供形態<select id="delivery-filter"><option value="all">すべて</option><option value="Webアプリ">Webアプリ</option><option value="インストール型">インストール型</option><option value="モバイルアプリ">モバイルアプリ</option></select></label>
          <label class="field">OSS<select id="oss-filter"><option value="all">すべて</option><option value="yes">OSS</option><option value="unknown">不明</option></select></label>
          <label class="include-dead"><input id="include-dead" type="checkbox"> 終了／到達不能も含める</label>
          <label class="include-dead"><input id="saved-only" type="checkbox"> 保存済みだけ</label>
          <label class="field advanced-nip">NIP番号・名称<input id="nip-query" type="search" placeholder="46 / remote signing"></label>
          <div class="filter-help">
            <details><summary>「不明」について</summary><p>材料不足で判定を保留した状態です。非対応を意味しません。終了／到達不能は明示的に選んだ場合だけ表示します。</p></details>
            <button class="text-button" id="clear-filters" type="button">条件をリセット</button>
          </div>
        </div>
      </details>

      <div id="ui-state-view" aria-live="polite"></div>
      <div id="compare-actions" class="compare-actions" hidden>
        <span id="compare-summary"></span>
        <div>
          <button id="open-compare" class="primary" type="button" disabled>機能で比較</button>
          <button id="clear-compare" class="ghost" type="button">選択解除</button>
        </div>
      </div>
      <div id="tool-results" class="feature-tool-results"></div>
    </section>

    <section id="nip-reference" class="nip-reference" aria-labelledby="nip-reference-title">
      <div class="section-head">
        <div><span class="step">NIP</span><h2 id="nip-reference-title">技術的な裏付け</h2></div>
        <span id="nip-count" class="count-pill"></span>
      </div>
      <div id="nip-list" class="nip-list" aria-live="polite"></div>
    </section>

    <details id="state-lab" class="state-lab nip-state-lab">
      <summary>表示状態を確認</summary>
      <div class="state-buttons" role="group" aria-label="表示状態">
        <button class="secondary" data-ui-state="normal">normal</button>
        <button class="secondary" data-ui-state="loading">loading</button>
        <button class="secondary" data-ui-state="empty">empty</button>
        <button class="secondary" data-ui-state="error">error</button>
        <button class="secondary" data-ui-state="partial">partial</button>
        <button class="secondary" data-ui-state="offline">offline</button>
      </div>
    </details>
    <p class="footer-note">静的サイトです。バックエンド・専用API・永続DB・中央インデクサはありません。Nostr接続・署名・送信も行いません。</p>
  </main>

  <dialog id="evidence-dialog" aria-labelledby="evidence-title"><div id="evidence-content"></div></dialog>
  <dialog id="compare-dialog" class="comparison-dialog" aria-labelledby="compare-title"><div id="compare-content"></div></dialog>
  <dialog id="review-dialog" class="review-dialog" aria-labelledby="review-title"><div id="review-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="nip-explorer.js"></script>
</body>
</html>
